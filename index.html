<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sahil QR Code Generator</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="card">
<h1>Sahil QR Code Generator</h1>
<p>Text, link ya phone number ka QR code banayein</p>
<input id="text" placeholder="Text ya website URL likhein">
<button onclick="generateQR()">QR Code Banaye</button>
<div id="qrcode"></div>
<button id="download" onclick="downloadQR()" style="display:none">QR Code Download Kare</button>
</div>
<script src="script.js"></script>
</body>
</html>
